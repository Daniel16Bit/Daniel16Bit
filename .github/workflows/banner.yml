name: Generate Banner

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/generate_banner.py"
      - ".github/workflows/banner.yml"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate banner SVGs
        run: python3 .github/scripts/generate_banner.py .

      - name: Commit banners to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add banner-dark.svg banner-light.svg
          git diff --staged --quiet || git commit -m "Update banner [skip ci]"
          git push
